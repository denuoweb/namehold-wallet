name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Checked-in version (optional; must match package.json)"
        required: false
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# A tag push and a manual dispatch use different refs but can still resolve the
# same checked-in version. Serialize every release run for this repository so
# those two entry points can never mutate one draft concurrently.
concurrency:
  group: namehold-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # Validate the checked-in version and exact tag/manual input before opening a
  # DRAFT release that the per-OS build jobs upload their bundles to.
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      source_sha: ${{ steps.resolve.outputs.source_sha }}
      release_id: ${{ steps.draft.outputs.release_id }}
      release_notes: ${{ steps.release_notes.outputs.notes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve + validate version
        id: resolve
        # Untrusted/manual inputs are passed via env (never interpolated into the
        # script). Tags and optional manual input must match the checked-in version.
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
          PRERELEASE_INPUT: ${{ github.event.inputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          V="$(jq -r .version package.json)"
          if [ "$EVENT_NAME" = "push" ]; then
            RELEASE_TAG="$REF_NAME" node scripts/check-version-consistency.mjs
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            EXPECTED_VERSION="${VERSION_INPUT:-}" node scripts/check-version-consistency.mjs
          else
            echo "::error::Unsupported release event '$EVENT_NAME'"
            exit 1
          fi
          PRE=false
          if [ "${PRERELEASE_INPUT:-false}" = "true" ] || printf '%s' "$V" | grep -Eq -- '-(alpha|beta|rc)'; then
            PRE=true
          fi
          SOURCE_SHA="$(git rev-parse HEAD)"
          if ! printf '%s\n' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::Unable to resolve one exact source commit."
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$V prerelease=$PRE source=$SOURCE_SHA"

      - name: Verify release repository matches updater channel
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: node scripts/check-release-authority.mjs

      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.resolve.outputs.version }}
          PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
          SHA: ${{ steps.resolve.outputs.source_sha }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PRE_FLAG=""
          [ "$PRERELEASE" = "true" ] && PRE_FLAG="--prerelease"
          # A manual run must never rebuild a version already tagged in this
          # release repository from a different commit.
          EXACT_TAG_REF="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .ref")"
          if [ -n "$EXACT_TAG_REF" ]; then
            EXISTING_TAG_SHA="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)"
            if [ "$EXISTING_TAG_SHA" != "$SHA" ]; then
              echo "::error::$TAG already resolves to $EXISTING_TAG_SHA; this workflow is running at $SHA. Bump the checked-in version instead of rebuilding an existing version from new source."
              exit 1
            fi
          fi

          # GitHub's release-by-tag endpoint omits drafts. Enumerate the
          # authenticated release list so a published release can never be
          # mistaken for an idempotent draft rerun.
          RELEASES_JSON="$RUNNER_TEMP/namehold-releases.json"
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RELEASES_JSON"
          RELEASE_COUNT="$(jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | length' "$RELEASES_JSON")"
          if [ "$RELEASE_COUNT" -gt 1 ]; then
            echo "::error::Found multiple releases for $TAG; refusing ambiguous release mutation."
            exit 1
          fi

          if [ "$RELEASE_COUNT" -eq 1 ]; then
            EXISTING_DRAFT="$(jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) | .draft' "$RELEASES_JSON")"
            EXISTING_TARGET="$(jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) | .target_commitish' "$RELEASES_JSON")"
            RID="$(jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) | .id' "$RELEASES_JSON")"
            if [ "$EXISTING_DRAFT" != "true" ]; then
              echo "::error::$TAG is already public; published signed assets and latest.json are immutable. Bump the checked-in version."
              exit 1
            fi
            if [ "$EXISTING_TARGET" != "$SHA" ]; then
              echo "::error::Existing $TAG draft targets $EXISTING_TARGET, not exact source $SHA. Delete the abandoned draft or bump the version after review."
              exit 1
            fi
          else
            gh release create "$TAG" \
              --target "$SHA" \
              --draft \
              --title "Namehold $TAG" \
              --generate-notes \
              $PRE_FLAG
            gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > "$RELEASES_JSON"
            RELEASE_COUNT="$(jq --arg tag "$TAG" '[.[][] | select(.tag_name == $tag)] | length' "$RELEASES_JSON")"
            if [ "$RELEASE_COUNT" -ne 1 ]; then
              echo "::error::Unable to read back one draft for $TAG."
              exit 1
            fi
            EXISTING_DRAFT="$(jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) | .draft' "$RELEASES_JSON")"
            EXISTING_TARGET="$(jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) | .target_commitish' "$RELEASES_JSON")"
            RID="$(jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) | .id' "$RELEASES_JSON")"
            if [ "$EXISTING_DRAFT" != "true" ] || [ "$EXISTING_TARGET" != "$SHA" ]; then
              echo "::error::Created release did not read back as an exact-source draft."
              exit 1
            fi
          fi
          echo "release_id=$RID" >> "$GITHUB_OUTPUT"

      - name: Set release notes from CHANGELOG.md
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          SOURCE_SHA: ${{ steps.resolve.outputs.source_sha }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          # Extract the CHANGELOG.md section for this version:
          # - Match from "## [$VERSION]" to the next "## [" (or EOF).
          # - Print only the interior lines (skip the boundary headers).
          # - Trim leading blank lines.
          NOTES="$(awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d')"
          if [ -z "$NOTES" ]; then
            echo "::error::CHANGELOG.md has no non-empty section for $VERSION; updater notes are mandatory."
            exit 1
          fi
          echo "Setting release body from CHANGELOG.md ($VERSION):"
          echo "$NOTES" | head -5
          echo "..."
          # Re-read and update the exact draft ID. Never address release state by
          # tag after preparation: an administrator may have changed it.
          RELEASE_JSON="$RUNNER_TEMP/namehold-release-before-notes.json"
          NOTES_FILE="$RUNNER_TEMP/namehold-release-notes.md"
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RELEASE_JSON"
          if [ "$(jq -r .draft "$RELEASE_JSON")" != "true" ] || \
             [ "$(jq -r .tag_name "$RELEASE_JSON")" != "$TAG" ] || \
             [ "$(jq -r .target_commitish "$RELEASE_JSON")" != "$SOURCE_SHA" ]; then
            echo "::error::Release identity, source, or draft state changed before notes were applied."
            exit 1
          fi
          printf '%s\n' "$NOTES" > "$NOTES_FILE"
          jq -n --rawfile body "$NOTES_FILE" '{body: $body}' | \
            gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" --input - >/dev/null
          DELIMITER="NAMEHOLD_RELEASE_NOTES_${RANDOM}_${RANDOM}"
          {
            echo "notes<<$DELIMITER"
            printf '%s\n' "$NOTES"
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      # The pinned tauri-action merges, deletes, and re-uploads latest.json.
      # Serial execution prevents two OS jobs from racing a partial manifest.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: "--bundles nsis,updater"
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    env:
      # Compiler-cache the release build (mirrors ci.yml). sccache stacks with
      # Swatinem/rust-cache: rust-cache restores the target dir, sccache fills
      # gaps (new/changed crates) — critical on macOS, which compiles the whole
      # dependency graph twice (aarch64 + x86_64) for the universal bundle.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # Post-startup ghac IO errors fall back to a direct compile instead of
      # aborting the build (see sccache#1751). Startup-time backend outages are
      # handled by the "Verify sccache backend" step below.
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Refresh apt package index (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        # Refresh the apt index first (see ci.yml): avoids a cache-miss 404 when
        # the runner's pre-seeded index points at a superseded .deb version.
        run: sudo apt-get update
      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        # Cached via `awalsh128/cache-apt-pkgs-action` (same as ci.yml) so a slow
        # apt mirror can't stall the release build. Keep `version` in sync with
        # ci.yml when the package list changes.
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9  # v1.6.3
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libappindicator3-dev
            librsvg2-dev
            patchelf
            build-essential
            libssl-dev
          # v2: bust the poisoned v1 cache (stale-index 404 dropped deps). Keep
          # in sync with ci.yml.
          version: "2"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.17.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.97.0
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.rust_targets }}

      # sccache (all platforms). Installed before Swatinem so the compiler
      # wrapper is on PATH by the time cargo runs. `mozilla/sccache-action`
      # handles per-OS binary install; the GHA backend is enabled via the
      # job-level env block above.
      - uses: mozilla/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7

      # If the GitHub Actions Cache backend is unavailable, sccache's server
      # fails to start and — because it's RUSTC_WRAPPER — hard-fails the whole
      # job before any crate compiles (observed on ghac HTTP 400 outages).
      # Probe startup here; if it fails, unset the wrapper so cargo compiles
      # directly. Swatinem's target-dir cache still applies, so we stay green.
      - name: Verify sccache backend (degrade gracefully if ghac is down)
        shell: bash
        run: |
          if ! sccache --start-server 2>/tmp/sccache_start.log; then
            echo "::warning::sccache failed to start (ghac backend likely unavailable) — disabling compiler cache for this run"
            cat /tmp/sccache_start.log || true
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Stabilise the cache key against `Cargo.toml`/`Cargo.lock` version
          # bumps (which fold into the default key hash). Every real release
          # bumps `[package] version`, which would otherwise miss the cache
          # each release — devastating on macOS (compiles both arches from
          # scratch: ~13 min of dep compile). `shared-key` mirrors the
          # `rust-ci` pattern in ci.yml. Per-OS keys are still separated by
          # Swatinem's own OS/arch prefix.
          shared-key: release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the namehold-syncd daemon sidecar for bundling. Tauri's externalBin
      # expects `binaries/namehold-syncd-<target-triple>` in src-tauri/. For the
      # macOS universal build, we compile for both architectures and lipo them.
      - name: Build sidecar (macOS universal)
        if: matrix.platform == 'macos-latest'
        working-directory: src-tauri
        run: |
          set -euo pipefail
          mkdir -p binaries
          cargo build --release --bin namehold-syncd --target aarch64-apple-darwin
          cargo build --release --bin namehold-syncd --target x86_64-apple-darwin
          # Stage per-arch binaries for externalBin validation + resource bundling.
          cp target/aarch64-apple-darwin/release/namehold-syncd binaries/namehold-syncd-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/namehold-syncd binaries/namehold-syncd-x86_64-apple-darwin
          # externalBin resolves to `binaries/namehold-syncd-<target-triple>`; for a
          # universal build the triple is `universal-apple-darwin`, so stage a
          # lipo'd universal binary there too.
          lipo -create -output binaries/namehold-syncd-universal-apple-darwin \
            target/aarch64-apple-darwin/release/namehold-syncd \
            target/x86_64-apple-darwin/release/namehold-syncd
          # Tauri's universal bundler only lipos the main binary; additional [[bin]]
          # targets must be manually lipo'd into the universal output directory,
          # otherwise the .app bundling step fails to find `namehold-syncd` there.
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/namehold-syncd \
            target/aarch64-apple-darwin/release/namehold-syncd \
            target/x86_64-apple-darwin/release/namehold-syncd

      - name: Build sidecar (Linux/Windows)
        if: matrix.platform != 'macos-latest'
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          mkdir -p binaries
          TARGET_TRIPLE=$(rustc --print host-tuple)
          cargo build --release --bin namehold-syncd
          EXT=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then EXT=".exe"; fi
          cp "target/release/namehold-syncd${EXT}" "binaries/namehold-syncd-${TARGET_TRIPLE}${EXT}"

      - name: Build + upload bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0 (audited)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Updater signing (required for auto-update) ---
          # Ed25519 keypair generated with `pnpm tauri signer generate`. The
          # public key lives in tauri.conf.json → plugins.updater.pubkey; the
          # private key is stored ONLY as a GitHub Actions secret.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- macOS code signing (optional; unset = unsigned bundles) ---
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: true
          updaterJsonKeepUniversal: false
          # tauri-action copies this value into latest.json. Editing only the
          # GitHub Release body leaves the in-app updater notes empty.
          releaseBody: ${{ needs.prepare.outputs.release_notes }}
          args: ${{ matrix.args }}

      # Surface cache effectiveness in the job log (hit rate, compile requests).
      # `if: always()` so we still see stats when the build fails. Skipped
      # automatically when the wrapper was disabled by the degrade step above.
      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Verify updater manifest was produced
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
          EXPECTED_NOTES: ${{ needs.prepare.outputs.release_notes }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          RELEASE_JSON="$RUNNER_TEMP/namehold-release.json"
          RELEASE_ASSETS_JSON="$RUNNER_TEMP/namehold-release-assets.json"
          MANIFEST_DIR="$RUNNER_TEMP/namehold-updater-manifest"
          ASSET_NAMES="$RUNNER_TEMP/namehold-release-assets.txt"
          mkdir -p "$MANIFEST_DIR"

          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RELEASE_JSON"
          if [ "$(jq -r .draft "$RELEASE_JSON")" != "true" ]; then
            echo "::error::$TAG is no longer a draft; refusing to mutate a public release."
            exit 1
          fi
          if [ "$(jq -r .tag_name "$RELEASE_JSON")" != "$TAG" ] || \
             [ "$(jq -r .target_commitish "$RELEASE_JSON")" != "$SOURCE_SHA" ]; then
            echo "::error::Release identity or source target changed after preparation."
            exit 1
          fi

          gh api --paginate --slurp \
            "repos/$GH_REPO/releases/$RELEASE_ID/assets?per_page=100" \
            > "$RELEASE_ASSETS_JSON"
          jq -r '.[][] | .name' "$RELEASE_ASSETS_JSON" | sort -u > "$ASSET_NAMES"
          echo "Release assets:"; cat "$ASSET_NAMES"
          if ! grep -qx 'latest.json' "$ASSET_NAMES"; then
            echo "::error::latest.json missing from $TAG — updater signing likely not configured."
            exit 1
          fi
          LATEST_COUNT="$(jq '[.[][] | select(.name == "latest.json")] | length' "$RELEASE_ASSETS_JSON")"
          if [ "$LATEST_COUNT" -ne 1 ]; then
            echo "::error::$TAG must contain exactly one latest.json asset."
            exit 1
          fi
          LATEST_ID="$(jq -r '.[][] | select(.name == "latest.json") | .id' "$RELEASE_ASSETS_JSON")"
          gh api \
            -H 'Accept: application/octet-stream' \
            "repos/$GH_REPO/releases/assets/$LATEST_ID" \
            > "$MANIFEST_DIR/latest.json"
          EXPECTED_VERSION="$VERSION" \
          EXPECTED_REPOSITORY="$GH_REPO" \
          node scripts/validate-updater-manifest.mjs \
            "$MANIFEST_DIR/latest.json" "$ASSET_NAMES"

      - name: Un-draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          RELEASE_JSON="$RUNNER_TEMP/namehold-release-before-publish.json"
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RELEASE_JSON"
          if [ "$(jq -r .draft "$RELEASE_JSON")" != "true" ] || \
             [ "$(jq -r .tag_name "$RELEASE_JSON")" != "$TAG" ] || \
             [ "$(jq -r .target_commitish "$RELEASE_JSON")" != "$SOURCE_SHA" ]; then
            echo "::error::Release identity, source, or draft state changed immediately before publication."
            exit 1
          fi
          EXACT_TAG_REF="$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .ref")"
          if [ -n "$EXACT_TAG_REF" ]; then
            TAG_SHA="$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)"
            if [ "$TAG_SHA" != "$SOURCE_SHA" ]; then
              echo "::error::$TAG changed to $TAG_SHA before publication; expected $SOURCE_SHA."
              exit 1
            fi
          fi
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
            -F draft=false >/dev/null
          RELEASE_JSON="$RUNNER_TEMP/namehold-published-release.json"
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RELEASE_JSON"
          if [ "$(jq -r .draft "$RELEASE_JSON")" != "false" ] || \
             [ "$(jq -r .tag_name "$RELEASE_JSON")" != "$TAG" ] || \
             [ "$(jq -r .target_commitish "$RELEASE_JSON")" != "$SOURCE_SHA" ]; then
            echo "::error::Published release readback did not match the approved release."
            exit 1
          fi
