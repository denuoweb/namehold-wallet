name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Checked-in version (optional; must match package.json)"
        required: false
        type: string
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Prevent a re-tag (or force-push of a tag) from stacking parallel release
# builds against the same ref. `cancel-in-progress: false` keeps a running
# release safe from accidental cancellation — a second tag with the same name
# just waits its turn instead of racing.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Validate the checked-in version and exact tag/manual input before opening a
  # DRAFT release that the per-OS build jobs upload their bundles to.
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve + validate version
        id: resolve
        # Untrusted/manual inputs are passed via env (never interpolated into the
        # script). Tags and optional manual input must match the checked-in version.
        env:
          VERSION_INPUT: ${{ github.event.inputs.version }}
          PRERELEASE_INPUT: ${{ github.event.inputs.prerelease }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          V="$(jq -r .version package.json)"
          if [ "$EVENT_NAME" = "push" ]; then
            RELEASE_TAG="$REF_NAME" node scripts/check-version-consistency.mjs
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            EXPECTED_VERSION="${VERSION_INPUT:-}" node scripts/check-version-consistency.mjs
          else
            echo "::error::Unsupported release event '$EVENT_NAME'"
            exit 1
          fi
          PRE=false
          if [ "${PRERELEASE_INPUT:-false}" = "true" ] || printf '%s' "$V" | grep -Eq -- '-(alpha|beta|rc)'; then
            PRE=true
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "Resolved version=$V prerelease=$PRE"

      - name: Create draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
          PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          PRE_FLAG=""
          [ "$PRERELEASE" = "true" ] && PRE_FLAG="--prerelease"
          # Idempotent: create the draft (tagging $SHA on manual runs); if a release
          # for the tag already exists (re-run), just reuse it.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$SHA" \
              --draft \
              --title "Namehold $TAG" \
              --generate-notes \
              $PRE_FLAG
          fi
          RID="$(gh release view "$TAG" --json databaseId --jq .databaseId)"
          echo "release_id=$RID" >> "$GITHUB_OUTPUT"

      - name: Set release notes from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          # Extract the CHANGELOG.md section for this version:
          # - Match from "## [$VERSION]" to the next "## [" (or EOF).
          # - Print only the interior lines (skip the boundary headers).
          # - Trim leading blank lines.
          NOTES="$(awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d')"
          if [ -z "$NOTES" ]; then
            echo "::warning::No CHANGELOG.md entry found for $VERSION — keeping auto-generated notes."
            exit 0
          fi
          echo "Setting release body from CHANGELOG.md ($VERSION):"
          echo "$NOTES" | head -5
          echo "..."
          # Write to a temp file to avoid shell quoting issues with special chars.
          printf '%s\n' "$NOTES" > /tmp/release-notes.md
          gh release edit "$TAG" --notes-file /tmp/release-notes.md

  build:
    name: Build (${{ matrix.platform }})
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
          - platform: windows-latest
            args: "--bundles nsis,updater"
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    env:
      # Compiler-cache the release build (mirrors ci.yml). sccache stacks with
      # Swatinem/rust-cache: rust-cache restores the target dir, sccache fills
      # gaps (new/changed crates) — critical on macOS, which compiles the whole
      # dependency graph twice (aarch64 + x86_64) for the universal bundle.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      # Post-startup ghac IO errors fall back to a direct compile instead of
      # aborting the build (see sccache#1751). Startup-time backend outages are
      # handled by the "Verify sccache backend" step below.
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Refresh apt package index (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        # Refresh the apt index first (see ci.yml): avoids a cache-miss 404 when
        # the runner's pre-seeded index points at a superseded .deb version.
        run: sudo apt-get update
      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        # Cached via `awalsh128/cache-apt-pkgs-action` (same as ci.yml) so a slow
        # apt mirror can't stall the release build. Keep `version` in sync with
        # ci.yml when the package list changes.
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9  # v1.6.3
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libappindicator3-dev
            librsvg2-dev
            patchelf
            build-essential
            libssl-dev
          # v2: bust the poisoned v1 cache (stale-index 404 dropped deps). Keep
          # in sync with ci.yml.
          version: "2"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.17.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # 1.97.0
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.rust_targets }}

      # sccache (all platforms). Installed before Swatinem so the compiler
      # wrapper is on PATH by the time cargo runs. `mozilla/sccache-action`
      # handles per-OS binary install; the GHA backend is enabled via the
      # job-level env block above.
      - uses: mozilla/sccache-action@054db53350805f83040bf3e6e9b8cf5a139aa7c9 # v0.0.7

      # If the GitHub Actions Cache backend is unavailable, sccache's server
      # fails to start and — because it's RUSTC_WRAPPER — hard-fails the whole
      # job before any crate compiles (observed on ghac HTTP 400 outages).
      # Probe startup here; if it fails, unset the wrapper so cargo compiles
      # directly. Swatinem's target-dir cache still applies, so we stay green.
      - name: Verify sccache backend (degrade gracefully if ghac is down)
        shell: bash
        run: |
          if ! sccache --start-server 2>/tmp/sccache_start.log; then
            echo "::warning::sccache failed to start (ghac backend likely unavailable) — disabling compiler cache for this run"
            cat /tmp/sccache_start.log || true
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # Stabilise the cache key against `Cargo.toml`/`Cargo.lock` version
          # bumps (which fold into the default key hash). Every real release
          # bumps `[package] version`, which would otherwise miss the cache
          # each release — devastating on macOS (compiles both arches from
          # scratch: ~13 min of dep compile). `shared-key` mirrors the
          # `rust-ci` pattern in ci.yml. Per-OS keys are still separated by
          # Swatinem's own OS/arch prefix.
          shared-key: release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the namehold-syncd daemon sidecar for bundling. Tauri's externalBin
      # expects `binaries/namehold-syncd-<target-triple>` in src-tauri/. For the
      # macOS universal build, we compile for both architectures and lipo them.
      - name: Build sidecar (macOS universal)
        if: matrix.platform == 'macos-latest'
        working-directory: src-tauri
        run: |
          set -euo pipefail
          mkdir -p binaries
          cargo build --release --bin namehold-syncd --target aarch64-apple-darwin
          cargo build --release --bin namehold-syncd --target x86_64-apple-darwin
          # Stage per-arch binaries for externalBin validation + resource bundling.
          cp target/aarch64-apple-darwin/release/namehold-syncd binaries/namehold-syncd-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/namehold-syncd binaries/namehold-syncd-x86_64-apple-darwin
          # externalBin resolves to `binaries/namehold-syncd-<target-triple>`; for a
          # universal build the triple is `universal-apple-darwin`, so stage a
          # lipo'd universal binary there too.
          lipo -create -output binaries/namehold-syncd-universal-apple-darwin \
            target/aarch64-apple-darwin/release/namehold-syncd \
            target/x86_64-apple-darwin/release/namehold-syncd
          # Tauri's universal bundler only lipos the main binary; additional [[bin]]
          # targets must be manually lipo'd into the universal output directory,
          # otherwise the .app bundling step fails to find `namehold-syncd` there.
          mkdir -p target/universal-apple-darwin/release
          lipo -create -output target/universal-apple-darwin/release/namehold-syncd \
            target/aarch64-apple-darwin/release/namehold-syncd \
            target/x86_64-apple-darwin/release/namehold-syncd

      - name: Build sidecar (Linux/Windows)
        if: matrix.platform != 'macos-latest'
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          mkdir -p binaries
          TARGET_TRIPLE=$(rustc --print host-tuple)
          cargo build --release --bin namehold-syncd
          EXT=""
          if [[ "$RUNNER_OS" == "Windows" ]]; then EXT=".exe"; fi
          cp "target/release/namehold-syncd${EXT}" "binaries/namehold-syncd-${TARGET_TRIPLE}${EXT}"

      - name: Build + upload bundles
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0 (audited)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # --- Updater signing (required for auto-update) ---
          # Ed25519 keypair generated with `pnpm tauri signer generate`. The
          # public key lives in tauri.conf.json → plugins.updater.pubkey; the
          # private key is stored ONLY as a GitHub Actions secret.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # --- macOS code signing (optional; unset = unsigned bundles) ---
          # APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          # APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}

      # Surface cache effectiveness in the job log (hit rate, compile requests).
      # `if: always()` so we still see stats when the build fails. Skipped
      # automatically when the wrapper was disabled by the degrade step above.
      - name: sccache stats
        if: always()
        shell: bash
        run: sccache --show-stats || true

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify updater manifest was produced
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          # tauri-action uploads `latest.json` (the updater manifest) to the
          # release when createUpdaterArtifacts + signing key are set. Fail the
          # publish if it's missing, so we never un-draft a release that would
          # leave existing installs unable to update.
          assets="$(gh release view "v$VERSION" --json assets --jq '.assets[].name')"
          echo "Release assets:"; echo "$assets"
          if ! printf '%s\n' "$assets" | grep -qx 'latest.json'; then
            echo "::error::latest.json missing from release v$VERSION — updater signing likely not configured (set TAURI_SIGNING_PRIVATE_KEY)."
            exit 1
          fi

      - name: Un-draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v$VERSION" --draft=false
